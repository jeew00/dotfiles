# Shared tmux config. ~/.tmux.conf loads it (see files.list). Needs tmux 3.2 or later.
# ─────────────────────────────────────────────────────────────
# Terminal / color — make inside-tmux match outside-tmux
# ─────────────────────────────────────────────────────────────

# Tell tmux it lives in a 256color terminal, and advertise tmux's
# own feature-rich terminfo to apps running inside it.
set -g default-terminal "tmux-256color"

# True color (24-bit). The Tc/RGB capability is what lets Claude
# Code, vim themes, syntax highlighting, etc. show real colors.
# Apply broadly so it works whichever TERM your outer emulator uses.
set -as terminal-features "*:RGB"
set -ag terminal-overrides ",xterm-256color:RGB,*-256color:RGB,screen-256color:RGB"

# Undercurl + colored underlines (used by some TUIs / editors)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p2%{256}%/%d::%p3%d%;m'

# ─────────────────────────────────────────────────────────────
# Latency / responsiveness — the #1 thing that makes tmux feel
# "in the way" for editors and TUIs
# ─────────────────────────────────────────────────────────────

# Near-zero delay after Escape. Old default was 500ms, which makes
# vim/neovim laggy. Do NOT use 0: over SSH, escape sequences (e.g.
# mouse reports) get split and leak as text like "<35;35;5m".
set -sg escape-time 10

# Don't constrain window size to the smallest *attached* client
# when other clients are connected to the same session.
setw -g aggressive-resize on

# Bigger scrollback so logs/build output aren't lost.
set -g history-limit 100000

# Let apps set the terminal title (so your emulator tab shows
# what's actually running).
set -g set-titles on
set -g set-titles-string "#T"

# Focus events — lets vim/neovim autoread, and some TUIs redraw,
# when you switch panes/windows.
set -g focus-events on

# ─────────────────────────────────────────────────────────────
# Keys & passthrough — let TUIs receive the full keyboard
# ─────────────────────────────────────────────────────────────

# Pass through extended keys (modifiers like Ctrl/Shift/Alt on
# arrows, function keys, etc.) so apps that want them get them.
set -g allow-passthrough on
set -g extended-keys on
set -as terminal-features '*:extkeys'
bind -n S-Enter send-keys Escape "[13;2u"

# Allow apps to use the system clipboard via OSC 52 (works over SSH).
set -g set-clipboard on

# Mouse: scroll, select panes, resize by dragging. Most TUIs that
# want the mouse will still get mouse events; tmux only intercepts
# when the app isn't in mouse mode.
set -g mouse on

# ─────────────────────────────────────────────────────────────
# vi mode
# ─────────────────────────────────────────────────────────────
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ─────────────────────────────────────────────────────────────
# Index / sanity
# ─────────────────────────────────────────────────────────────
set -g base-index 1            # windows start at 1
setw -g pane-base-index 1      # panes start at 1
set -g renumber-windows on     # keep window numbers gapless

# ─────────────────────────────────────────────────────────────
# Minimal, readable status bar
# ─────────────────────────────────────────────────────────────
set -g status-interval 5
set -g status-left "#[bold] #S #[default]"
set -g status-right "%H:%M %d-%b"
set -g status-left-length 30
# Colors: pink, or the theme that this machine chose in local.conf.
# A different color on each machine shows which host you are on.
# Change it: sh ~/dotfiles/install.sh --theme <name>
source-file ~/dotfiles/tmux/themes/pink.conf
source-file -q ~/.config/tmux/local.conf

# Reload config quickly
bind r source-file ~/.tmux.conf \; display "reloaded"
