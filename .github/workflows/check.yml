# Run the check on each OS. This repo makes my machines behave the same on Windows,
# macOS and Linux, but before this, the check ran only on my Windows machine.
name: check
on:
  push:
  workflow_dispatch:
  # The server squash-merges, so the PR title becomes the commit subject on main.
  # "edited": check the title again when it changes.
  pull_request:
    types: [opened, edited, reopened]
permissions:
  contents: read
jobs:
  title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The title goes in through env, not into the script text: a title cannot run code.
      - name: Check the PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: sh scripts/check_subject.sh "$TITLE"
  check:
    # The push event already runs the full check for the PR's commits.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # On Windows, this is Git Bash: install.sh and the tests need sh.
        shell: bash
    env:
      # Also install the global tools (jq, and tmux on macOS and Linux), as a new machine does.
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/global.toml
    steps:
      # The actions are pinned to a commit: a tag can move to code that I did not review.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans the full history.
          fetch-depth: 0
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      # The tests run with an empty env, so a mise shim cannot find its version there.
      # Put the global tools on PATH, so that the jq and tmux tests run and are not skipped.
      - name: Put jq and tmux on PATH
        run: |
          dirname "$(mise which jq)" >> "$GITHUB_PATH"
          if [ "$RUNNER_OS" != Windows ]; then dirname "$(mise which tmux)" >> "$GITHUB_PATH"; fi
      # CI has each tool, so a skipped test is an error here.
      - name: Check, with no skipped test
        run: mise run check 2>&1 | tee check.log && ! grep '^skip' check.log
