[tools]
gitleaks = "8.30.1"
shellcheck = "0.11.0"

[tasks.check]
description = "Secret scan, lint and tests. Run before each merge."
run = [
  "gitleaks git --redact --no-banner .",
  "shellcheck install.sh hooks/pre-commit hooks/pre-push hooks/post-merge tests/install_test.sh",
  "sh tests/install_test.sh",
]
