[tools]
gitleaks = "8.30.1"
shellcheck = "0.11.0"
"aqua:rhysd/actionlint" = "1.7.12"

[tasks.check]
description = "Secret scan, lint and tests. Run before each merge."
# On Windows, mise runs a task with cmd. The pipe needs sh.
shell = "sh -c"
run = [
  "gitleaks git --redact --no-banner .",
  # Each shell script in the repo, also a new one before git add: none can be forgotten.
  "git ls-files -z --cached --others --exclude-standard '*.sh' 'hooks/*' | xargs -0 shellcheck",
  # The GitHub workflow. An error there shows only after a push.
  "actionlint",
  "sh tests/install_test.sh",
  "sh tests/prune_test.sh",
]

[tasks.prune]
description = "Remove each worktree whose branch is in main, and delete the branch. Run after a squash merge."
run = "sh scripts/prune.sh"
